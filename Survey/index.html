<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Market Research Survey</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .survey {
            max-width: 800px;
        }

        h1 {
            font-size: 28px;
            font-weight: normal;
        }

        .description {
            font-size: 16px;
            margin-bottom: 25px;
        }

        .question {
            margin-bottom: 25px;
        }

        .question label.title {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            padding: 6px;
            font-size: 16px;
        }

        .option {
            margin: 10px 0;
        }

        .option input {
            margin-right: 10px;
        }

        .other-input {
            margin-left: 32px;
            margin-top: 5px;
            width: 180px;
            padding: 5px;
        }
    </style>
</head>

<body>

<div class="survey">

    <h1>Market Research Survey</h1>

    <p class="description">
        Please take a few moments to complete this satisfaction survey.
    </p>

    <div class="question">
        <label class="title">What is your age range?</label>

        <select name="age">
            <option>18-24</option>
            <option>25-34</option>
            <option>35-50</option>
            <option>50+</option>
        </select>
    </div>

    <div class="question">
        <label class="title">What is your yearly income range?</label>

        <select name="income">
            <option>$0 - $25,000</option>
            <option>$25,001 - $50,000</option>
            <option>$50,001 - $100,000</option>
            <option>$100,000+</option>
        </select>
    </div>

    <div class="question">
        <label class="title">Gender Identity</label>

        <div class="option">
            <input type="radio" name="gender" value="Male"> Male
        </div>

        <div class="option">
            <input type="radio" name="gender" value="Female"> Female
        </div>

        <div class="option">
            <input type="radio" name="gender" value="Nonbinary"> Nonbinary
        </div>

        <div class="option">
            <input type="radio" name="gender" value="Other"> Other
        </div>

        <input type="text" name="otherGender" class="other-input">
    </div>

    <div class="question">
        <label class="title">
            Which of the following products have your purchased in the last 2 months.
            Please check all that apply.
        </label>

        <div class="option">
            <input type="checkbox" name="product" value="Product 1"> Product 1
        </div>

        <div class="option">
            <input type="checkbox" name="product" value="Product 2"> Product 2
        </div>

        <div class="option">
            <input type="checkbox" name="product" value="Product 3"> Product 3
        </div>
    </div>

    <div class="question">
        <label class="title">How often would you use our new product?</label>

        <div class="option">
            <input type="radio" name="frequency" value="Daily"> Daily
        </div>

    </div>

</div>

</body>
</html>
